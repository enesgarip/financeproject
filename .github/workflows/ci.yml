name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      database: ${{ steps.detect.outputs.database }}
      edge: ${{ steps.detect.outputs.edge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          frontend=false
          database=false
          edge=false

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] \
            || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            frontend=true
            database=true
            edge=true
          else
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            while IFS= read -r file; do
              case "$file" in
                src/*|public/*|tests/e2e/*|index.html|package.json|package-lock.json|vite.config.*|vitest.config.*|playwright.config.*|tsconfig*.json|eslint.config.*|.lighthouserc.cjs|vercel.json|.github/workflows/ci.yml|.github/workflows/deploy.yml|scripts/check-bundle-size.mjs|scripts/archive-source-maps.mjs|scripts/promote-vercel-deployment.mjs)
                  frontend=true
                  ;;
              esac
              case "$file" in
                supabase/migrations/*|supabase/tests/*|supabase/seed.sql|supabase/config.toml)
                  database=true
                  ;;
              esac
              case "$file" in
                supabase/functions/*)
                  edge=true
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, Coverage and Audit
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # setup-node'un npm cache'i yalnız indirme cache'i; npm ci yine tüm
      # node_modules'ü kurar. Lock hash'i anahtar olduğu için bayatlama yok.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Restore quality caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/eslint
          key: lint-content-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: |
            lint-content-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage gate)
        run: npm run test:coverage

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build and Bundle
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Restore TypeScript cache
        uses: actions/cache@v4
        with:
          path: node_modules/.tmp/*.tsbuildinfo
          key: typescript-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Bundle size budget
        run: npm run check:bundle

      # Lighthouse build bittiğinde başlar; lint/coverage'ı beklemez.
      - name: Upload built app for Lighthouse
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  quality:
    name: Lint and Build
    needs: [checks, build]
    # Branch protection ve Dependabot bu adı bekler; başarısız/skipped alt işi yutma.
    if: ${{ always() && !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality gate
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$BUILD_RESULT" = success

  lighthouse:
    name: Lighthouse
    needs: [changes, build]
    # Gece koşusunda build hiç koşmaz (skipped) — !cancelled() olmadan needs
    # zinciri bu job'ı da atlardı; PR'da build başarısızsa ölçüm yapılamaz.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (needs.changes.outputs.frontend == 'true' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      LHCI_VERSION: 0.15.1
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Use GitHub runner Chrome for Lighthouse
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Download built app (build job artifact)
        if: ${{ github.event_name != 'schedule' }}
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Build (gece koşusu — build job'ı çalışmadı)
        if: ${{ github.event_name == 'schedule' }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      # Paketi ölçüm penceresinin dışında indirip cache'liyoruz. Runner Chrome'u
      # ilerlerken eski bir Lighthouse motoruna sabitlememek için LHCI_VERSION da
      # açıkça güncel tutulur.
      - name: Restore Lighthouse CI cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: lhci-${{ runner.os }}-node24-${{ env.LHCI_VERSION }}

      - name: Prefetch Lighthouse CI
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" --help > /dev/null

      - name: Lighthouse CI
        run: timeout --signal=TERM --kill-after=15s "${LIGHTHOUSE_TIMEOUT_SECONDS}s" npx --yes "@lhci/cli@${LHCI_VERSION}" autorun
        env:
          LHCI_GITHUB_TOKEN: ${{ github.token }}
          LHCI_NUMBER_OF_RUNS: ${{ github.event_name == 'schedule' && '3' || '1' }}
          LHCI_MAX_WAIT_MS: ${{ github.event_name == 'schedule' && '90000' || '45000' }}
          LIGHTHOUSE_TIMEOUT_SECONDS: ${{ github.event_name == 'schedule' && '420' || '180' }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: Playwright Smoke
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e
        env:
          CI: "1"
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # Edge fonksiyonları tsc'nin tamamen kör noktasıydı: PR G'de parse-sms'teki
  # tip hatası sırf bu yüzden sessizce üretimde yaşadı. Path-filtreli tip kapısı;
  # yerel eşdeğeri `deno check supabase/functions/*/index.ts`.
  deno:
    name: Edge Deno Check
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.edge == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Remote import'lar (deno.land/jsr) ölçüm dışı bir kez inip cache'lenir.
      - name: Cache Deno modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Type-check edge functions
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/functions/*/index.ts)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::supabase/functions altında index.ts bulunamadı"
            exit 1
          fi
          deno check "${files[@]}"

  supabase:
    name: Supabase Migration Check
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    env:
      # ECR ortak runner IP'lerinde indirme kotasına takılabiliyor; resmi aynı-tag aynası.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Binary sabit sürümlü ve değişmez — GitHub release'ten her koşuda indirmek
      # hem yavaş hem flaky idi (retry döngüsünün varlığı kanıt).
      - name: Cache Supabase CLI
        id: sbcli-cache
        uses: actions/cache@v4
        with:
          path: /tmp/sbcli
          key: supabase-cli-linux-amd64-2.101.0

      - name: Download Supabase CLI (with retry)
        if: ${{ steps.sbcli-cache.outputs.cache-hit != 'true' }}
        run: |
          VERSION=2.101.0
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fSL "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz" -o supabase.tar.gz; then
              ok=1; break
            fi
            echo "Supabase CLI download attempt $i failed; retrying in 15s..."
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::Supabase CLI download failed after 5 attempts"; exit 1; }
          rm -rf /tmp/sbcli && mkdir -p /tmp/sbcli
          tar -xzf supabase.tar.gz -C /tmp/sbcli

      - name: Install Supabase CLI
        run: |
          sudo cp /tmp/sbcli/supabase* /usr/local/bin/
          sudo chmod +x /usr/local/bin/supabase*
          supabase --version

      - name: Start local Supabase (migration'lar dahil)
        run: supabase db start

      # `db start` migration'ların tamamını ZATEN uyguluyor (CI logu kanıtı:
      # iki adım da aynı 133 migration'ı koşuyordu — çift iş). Reset'in kalan
      # tek katkısı seed'di; onu psql ile bir kez uyguluyoruz, seed.sql
      # doğrulaması kaybolmuyor.
      - name: Apply seed
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/seed.sql

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      # S4 sistemik düzeltme (denetim 2026-08-12): testler tek tek adım olarak
      # bağlanmıyor — supabase/tests/*.sql'in TAMAMI döngüyle koşar. Yeni eklenen
      # her .sql dosyası otomatik kapsanır; adım eklemeyi unutmak diye bir hata
      # sınıfı kalmaz. Yerel eşdeğeri: `npm run db:test:all`.
      - name: SQL test suite (supabase/tests/*.sql — hepsi otomatik)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/tests/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::supabase/tests altında .sql testi bulunamadı"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::${f}"
            docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < "$f"
            echo "::endgroup::"
          done

      # SQL↔TS ikiz diferansiyel harness'i (muh. turu ④): rastgele yazma dizisi
      # gerçek trigger'lardan geçer, çıktı TS ikizleriyle kuruş-birebir kıyaslanır.
      # Trigger migration'ı ikizden saparsa (K4 tipi yeniden yazım) burada kırmızı.
      - name: Setup Node (twin harness)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: ${{ steps.node-modules-cache.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: SQL↔TS twin equivalence harness
        run: npm run db:test:twins

  timings:
    name: Workflow Timings
    continue-on-error: true
    needs: [changes, checks, build, quality, lighthouse, e2e, deno, supabase]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Report durations and recent baseline
        run: node scripts/report-workflow-timings.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
