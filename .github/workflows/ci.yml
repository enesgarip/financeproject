name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      database: ${{ steps.detect.outputs.database }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          frontend=false
          database=false

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] \
            || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            frontend=true
            database=true
          else
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            while IFS= read -r file; do
              case "$file" in
                src/*|public/*|tests/e2e/*|index.html|package.json|package-lock.json|vite.config.*|vitest.config.*|playwright.config.*|tsconfig*.json|eslint.config.*|.lighthouserc.cjs|vercel.json)
                  frontend=true
                  ;;
              esac
              case "$file" in
                supabase/migrations/*|supabase/tests/*|supabase/seed.sql|supabase/config.toml)
                  database=true
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint and Build
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore quality caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/eslint
            node_modules/.tmp/*.tsbuildinfo
          key: quality-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage gate)
        run: npm run test:coverage

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Bundle size budget
        run: npm run check:bundle

  lighthouse:
    name: Lighthouse
    needs: changes
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      LHCI_VERSION: 0.15.1
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use GitHub runner Chrome for Lighthouse
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      # Paketi ölçüm penceresinin dışında indirip cache'liyoruz. Runner Chrome'u
      # ilerlerken eski bir Lighthouse motoruna sabitlememek için LHCI_VERSION da
      # açıkça güncel tutulur.
      - name: Restore Lighthouse CI cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: lhci-${{ runner.os }}-node24-${{ env.LHCI_VERSION }}

      - name: Prefetch Lighthouse CI
        run: npx --yes "@lhci/cli@${LHCI_VERSION}" --help > /dev/null

      - name: Lighthouse CI
        run: timeout --signal=TERM --kill-after=15s "${LIGHTHOUSE_TIMEOUT_SECONDS}s" npx --yes "@lhci/cli@${LHCI_VERSION}" autorun
        env:
          LHCI_GITHUB_TOKEN: ${{ github.token }}
          LHCI_NUMBER_OF_RUNS: ${{ github.event_name == 'schedule' && '3' || '1' }}
          LHCI_MAX_WAIT_MS: ${{ github.event_name == 'schedule' && '90000' || '45000' }}
          LIGHTHOUSE_TIMEOUT_SECONDS: ${{ github.event_name == 'schedule' && '420' || '180' }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: Playwright Smoke
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e
        env:
          CI: "1"
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  supabase:
    name: Supabase Migration Check
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Supabase CLI (with retry)
        run: |
          VERSION=2.101.0
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fSL "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz" -o supabase.tar.gz; then
              ok=1; break
            fi
            echo "Supabase CLI download attempt $i failed; retrying in 15s..."
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::Supabase CLI download failed after 5 attempts"; exit 1; }
          rm -rf /tmp/sbcli && mkdir -p /tmp/sbcli
          tar -xzf supabase.tar.gz -C /tmp/sbcli
          sudo cp /tmp/sbcli/supabase* /usr/local/bin/
          sudo chmod +x /usr/local/bin/supabase*
          supabase --version

      - name: Start local Supabase
        run: supabase db start

      - name: Reapply migrations and seed
        run: supabase db reset --local

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: RLS policy audit
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/rls_audit.sql

      - name: Table grant audit
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/grants_audit.sql

      - name: Maintenance catch-up idempotency
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/maintenance_catchup.sql

      - name: Card expense source-event idempotency
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/card_expense_idempotency.sql

      - name: Provision debt transitions
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/provision_debt.sql

      - name: Complete finance-data reset
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/reset_user_finance_data.sql

      - name: Expense contexts and car operations security
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/expense_contexts_and_cars.sql

      - name: Canonical card allocation security
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/card_allocation_security.sql

      - name: Data Health safe-repair security
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/data_health_safe_repairs.sql

      - name: Data Health acknowledgement persistence
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/data_health_issue_acknowledgements.sql

      - name: SMS account source-event idempotency
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/sms_account_idempotency.sql

      - name: Statement import installment correctness
        run: docker exec -i supabase_db_financeproject psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/tests/statement_import_installments.sql
